[pytest]
testpaths = tests
pythonpath = .
markers =
    unit: Unit tests
    api: API endpoint tests (Sessions, Feedback, Chat, Search, Health, Ready)
    rag: RAG pipeline tests (Chunking, Embedding, Indexing, Retrieval, Citations)
    regression: Regression and security guardrail tests
    slow: Slow running tests
addopts = -v --tb=short
